[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-parser"
version = "1.0.0"
description = "Ruida VCF (VCutWorks) binary format reader and writer — from-scratch serialization"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["vcf_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
